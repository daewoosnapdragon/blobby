<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soft Blobs pick your blob</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
button{font:inherit;cursor:pointer;transition:transform 160ms var(--ease-out)}
button:active{transform:scale(0.97)}
button:focus-visible{outline:3px solid #1F1F1F;outline-offset:3px}
.breathe{transform-origin:50% 100%;animation:breathe 3.2s var(--ease-in-out) infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s linear infinite}
.squish-a,.squish-b{transform-origin:50% 100%;animation:squish 500ms var(--ease-out)}
.squish-b{animation-name:squish2}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,0.97)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.12,0.86)}60%{transform:scale(0.95,1.06)}100%{transform:scale(1,1)}}
@keyframes squish2{0%{transform:scale(1,1)}30%{transform:scale(1.12,0.86)}60%{transform:scale(0.95,1.06)}100%{transform:scale(1,1)}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.squish-a,.squish-b{animation:none}}
a{color:#1F1F1F}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EF; font-family: 'M PLUS Rounded 1c', sans-serif; color: #1F1F1F; padding: 40px 18px 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

  <div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 15px; font-weight: 500; color: #6B655F">Hi, Minjun!</div>
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; line-height: 1.2">Pick your blob</h1>
  </div>

  <div style="position: relative; height: 260px; background: #FFFFFF; border-radius: 28px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
    <svg width="28" height="28" viewBox="0 0 24 24" style="position: absolute; right: 36px; top: 30px" aria-hidden="true"><path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2Z" fill="#F97940"></path></svg>
    <div class="{{ squishClass }}" style="width: 220px; height: 206px; margin-bottom: -26px">
      <svg class="breathe" width="220" height="206" viewBox="0 0 120 112" aria-hidden="true"><path d="M58 8 C84 2 112 18 114 48 C116 78 98 104 64 106 C30 108 4 88 6 58 C8 30 30 14 58 8 Z" fill="{{ fill }}"></path><g class="blink"><ellipse cx="48" cy="50" rx="5.5" ry="7.5" fill="#1F1F1F"></ellipse><ellipse cx="70" cy="48" rx="5.5" ry="7.5" fill="#1F1F1F"></ellipse></g><ellipse cx="38" cy="62" rx="6" ry="3.5" fill="#FF9FB0" opacity="0.8"></ellipse><ellipse cx="80" cy="60" rx="6" ry="3.5" fill="#FF9FB0" opacity="0.8"></ellipse></svg>
    </div>
  </div>

  <div role="radiogroup" aria-label="Blob color" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{ swatches }}" as="item" hint-placeholder-count="6">
      <button role="radio" aria-checked="{{ item.checked }}" aria-label="{{ item.name }}" onClick="{{ item.pick }}" style="height: 92px; border: none; border-radius: 22px; background: #FFFFFF; box-shadow: inset 0 0 0 {{ item.ring }}px #1F1F1F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1F1F1F">
        <svg width="46" height="43" viewBox="0 0 120 112" aria-hidden="true"><path d="M58 8 C84 2 112 18 114 48 C116 78 98 104 64 106 C30 108 4 88 6 58 C8 30 30 14 58 8 Z" fill="{{ item.color }}"></path><ellipse cx="48" cy="52" rx="7" ry="9" fill="#1F1F1F"></ellipse><ellipse cx="70" cy="50" rx="7" ry="9" fill="#1F1F1F"></ellipse></svg>
        <span style="font-size: 13px; font-weight: 700">{{ item.name }}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="text-align: center; font-size: 14px; font-weight: 500; color: #6B655F">You can change it later.</div>
  <button style="background: #1F1F1F; color: #FFFFFF; border: none; border-radius: 999px; padding: 8px 8px 8px 24px; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700">That's me!
    <span style="width: 44px; height: 44px; border-radius: 50%; background: {{ fill }}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 0, changes: 0 };
  }
  renderVals() {
    const pick = this.state.pick;
    const changes = this.state.changes;
    const colors = [
      { name: 'Sunny', color: '#FFD95A' },
      { name: 'Peach', color: '#FFC9A8' },
      { name: 'Pink', color: '#FFB5C1' },
      { name: 'Mint', color: '#B7E1D1' },
      { name: 'Sky', color: '#A9D3FF' },
      { name: 'Grape', color: '#D9CCF5' }
    ];
    const swatches = colors.map((c, i) => ({
      name: c.name,
      color: c.color,
      checked: i === pick ? 'true' : 'false',
      ring: i === pick ? 3 : 0,
      pick: () => this.setState({ pick: i, changes: changes + 1 })
    }));
    return {
      swatches: swatches,
      fill: colors[pick].color,
      squishClass: changes === 0 ? '' : (changes % 2 ? 'squish-a' : 'squish-b')
    };
  }
}
</script>
</body>
</html>
