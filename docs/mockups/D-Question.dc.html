<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soft Blobs pick the right one</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&amp;family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
button{font:inherit;cursor:pointer;transition:transform 160ms var(--ease-out)}
button:active{transform:scale(0.97)}
button:focus-visible{outline:3px solid #1F1F1F;outline-offset:3px}
.breathe{transform-origin:50% 100%;animation:breathe 3.2s var(--ease-in-out) infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s linear infinite}
.glance{animation:glance 7s var(--ease-in-out) infinite}
.hop{transform-origin:50% 100%;animation:hop 500ms var(--ease-out)}
.wobble-a,.wobble-b{transform-origin:50% 100%;animation:wobble 400ms var(--ease-out)}
.wobble-b{animation-name:wobble2}
.pop{animation:pop 250ms var(--ease-out) both}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,0.97)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes glance{0%,60%,100%{transform:translate(0,0)}68%,88%{transform:translate(3px,5px)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16px) scale(0.95,1.06)}70%{transform:translateY(0) scale(1.07,0.93)}100%{transform:translateY(0) scale(1,1)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
@keyframes wobble2{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}55%{transform:rotate(4deg)}80%{transform:rotate(-2deg)}}
@keyframes pop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.breathe,.blink,.glance,.hop,.wobble-a,.wobble-b{animation:none}.pop{animation:none;opacity:1}}
a{color:#1F1F1F}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EF; font-family: 'M PLUS Rounded 1c', sans-serif; color: #1F1F1F; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px">
    <button aria-label="Close lesson" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: none; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div aria-label="Question 5 of 8" style="flex-grow: 1; height: 10px; border-radius: 999px; background: #E9E2D9; overflow: hidden">
      <div style="width: 62%; height: 100%; border-radius: 999px; background: #1F1F1F"></div>
    </div>
    <div aria-label="142 stars" style="display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z" fill="#FFD95A" stroke="#1F1F1F" stroke-width="1.5" stroke-linejoin="round"></path></svg>
      <span>142</span>
    </div>
  </div>

  <div style="position: relative; background: #FFFFFF; border-radius: 28px; height: 208px; overflow: hidden">
    <span style="position: absolute; left: 18px; top: 16px; background: #B7E1D1; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700">Pick the right one</span>
    <div class="{{ moodClass }}" style="position: absolute; left: 20px; top: 62px; width: 136px; height: 128px">
      <div class="breathe" style="position: relative; width: 136px; height: 128px">
        <svg width="136" height="128" viewBox="0 0 120 112" aria-hidden="true"><path d="M58 8 C84 2 112 18 114 48 C116 78 98 104 64 106 C30 108 4 88 6 58 C8 30 30 14 58 8 Z" fill="#FFD95A"></path><ellipse cx="38" cy="66" rx="6" ry="3.5" fill="#FFB5C1"></ellipse><ellipse cx="82" cy="64" rx="6" ry="3.5" fill="#FFB5C1"></ellipse></svg>
        <sc-if value="{{ eyesIdle }}" hint-placeholder-val="{{ true }}">
          <svg width="136" height="128" viewBox="0 0 120 112" style="position: absolute; left: 0; top: 0" aria-hidden="true"><g class="glance"><g class="blink"><ellipse cx="50" cy="52" rx="5.5" ry="7.5" fill="#1F1F1F"></ellipse><ellipse cx="70" cy="50" rx="5.5" ry="7.5" fill="#1F1F1F"></ellipse></g></g></svg>
        </sc-if>
        <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ false }}">
          <svg width="136" height="128" viewBox="0 0 120 112" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="M43 54 q7 -9 14 0 M63 52 q7 -9 14 0" stroke="#1F1F1F" stroke-width="4" fill="none" stroke-linecap="round"></path><path d="M52 68 q8 7 16 0" stroke="#1F1F1F" stroke-width="3" fill="none" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{ eyesOops }}" hint-placeholder-val="{{ false }}">
          <svg width="136" height="128" viewBox="0 0 120 112" style="position: absolute; left: 0; top: 0" aria-hidden="true"><circle cx="50" cy="52" r="4" fill="#1F1F1F"></circle><circle cx="70" cy="50" r="4" fill="#1F1F1F"></circle><ellipse cx="60" cy="68" rx="4" ry="5" fill="#1F1F1F"></ellipse><path class="pop" d="M98 24 q-6 9 0 13 q6 -4 0 -13z" fill="#A9D3FF"></path></svg>
        </sc-if>
      </div>
    </div>
    <div style="position: absolute; right: 16px; top: 60px; width: 172px; background: #F7F3EF; border-radius: 20px 20px 20px 6px; padding: 14px 14px 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 19px; font-weight: 800; line-height: 1.3">{{ bubble }}</div>
      <button aria-label="Hear the sentences" style="align-self: flex-start; background: #FFFFFF; border: none; border-radius: 999px; padding: 6px 12px 6px 8px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1F1F1F; min-height: 36px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z" fill="#1F1F1F"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
        Hear it
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{ options }}" as="item" hint-placeholder-count="3">
      <button onClick="{{ item.pick }}" style="background: {{ item.bg }}; box-shadow: inset 0 0 0 2px {{ item.border }}; border: none; color: #1F1F1F; border-radius: 22px; padding: 16px 18px 16px 14px; text-align: left; font-family: Andika, sans-serif; font-size: 20px; display: flex; align-items: center; gap: 12px; min-height: 64px">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: {{ item.dot }}; display: flex; align-items: center; justify-content: center; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 15px; font-weight: 800">{{ item.letter }}</span>
        <span>{{ item.text }}</span>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <sc-if value="{{ showRight }}" hint-placeholder-val="{{ false }}">
    <div class="pop" style="background: #B7E1D1; border-radius: 24px; padding: 14px 14px 14px 20px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1">
        <div style="font-size: 20px; font-weight: 800">That's it!</div>
        <div style="font-size: 15px; font-weight: 500; color: #2F4A40">+1 star</div>
      </div>
      <button onClick="{{ reset }}" style="background: #1F1F1F; color: #FFFFFF; border: none; border-radius: 999px; padding: 7px 7px 7px 20px; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700">Next
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #FFD95A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ showWrong }}" hint-placeholder-val="{{ false }}">
    <div class="pop" style="background: #FFD9DF; border-radius: 24px; padding: 14px 14px 14px 20px; display: flex; align-items: center; gap: 12px">
      <div style="flex-grow: 1">
        <div style="font-size: 20px; font-weight: 800">Almost!</div>
        <div style="font-size: 15px; font-weight: 500; color: #5E2A33">Look closely at the verb.</div>
      </div>
      <button onClick="{{ reset }}" style="background: #FFFFFF; color: #1F1F1F; border: none; border-radius: 999px; padding: 12px 18px; font-size: 17px; font-weight: 700">Try again</button>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null, tries: 0 };
  }
  renderVals() {
    const picked = this.state.picked;
    const tries = this.state.tries;
    const answer = 1;
    const list = ['She don’t like carrots.', 'She doesn’t like carrots.', 'She doesn’t likes carrots.'];
    const letters = ['A', 'B', 'C'];
    const options = list.map((t, i) => {
      const isPicked = picked === i;
      let bg = '#FFFFFF';
      let border = '#FFFFFF';
      let dot = '#F7F3EF';
      if (isPicked && i === answer) { bg = '#E9F6F0'; border = '#1F1F1F'; dot = '#B7E1D1'; }
      if (isPicked && i !== answer) { bg = '#FFF1F3'; border = '#D9798B'; dot = '#FFB5C1'; }
      return { text: t, letter: letters[i], bg: bg, border: border, dot: dot, pick: () => this.setState({ picked: i, tries: tries + 1 }) };
    });
    const right = picked === answer;
    const wrong = picked !== null && !right;
    let moodClass = '';
    if (right) moodClass = 'hop';
    if (wrong) moodClass = tries % 2 ? 'wobble-a' : 'wobble-b';
    return {
      options: options,
      moodClass: moodClass,
      bubble: right ? 'Yes! You got it.' : (wrong ? 'Hmm, not that one.' : 'Which sentence is right?'),
      eyesIdle: picked === null,
      eyesHappy: right,
      eyesOops: wrong,
      showRight: right,
      showWrong: wrong,
      reset: () => this.setState({ picked: null })
    };
  }
}
</script>
</body>
</html>
