<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soft Blobs week done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
button{font:inherit;cursor:pointer;transition:transform 160ms var(--ease-out)}
button:active{transform:scale(0.97)}
button:focus-visible{outline:3px solid #1F1F1F;outline-offset:3px}
.cheer{transform-origin:50% 100%;animation:cheer 1000ms var(--ease-out) 150ms both}
.breathe{transform-origin:50% 100%;animation:breathe 3.2s var(--ease-in-out) 1.2s infinite}
.pop{animation:pop 250ms var(--ease-out) both}
@keyframes cheer{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(-26px) scale(0.94,1.07)}40%{transform:translateY(0) scale(1.08,0.92)}60%{transform:translateY(-14px) scale(0.97,1.03)}80%{transform:translateY(0) scale(1.04,0.96)}100%{transform:translateY(0) scale(1,1)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,0.97)}}
@keyframes pop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cheer,.breathe{animation:none}.pop{animation-name:fade}}
@keyframes fade{from{opacity:0}to{opacity:1}}
a{color:#1F1F1F}a:hover{color:#555}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F3EF; font-family: 'M PLUS Rounded 1c', sans-serif; color: #1F1F1F; padding: 20px 18px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

  <button aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: none; display: flex; align-items: center; justify-content: center; padding: 0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>

  <div style="position: relative; height: 290px; flex-shrink: 0">
    <span class="pop" style="position: absolute; left: 40px; top: 40px; width: 12px; height: 12px; border-radius: 50%; background: #FFB5C1; animation-delay: 300ms"></span>
    <span class="pop" style="position: absolute; left: 306px; top: 52px; width: 10px; height: 10px; border-radius: 50%; background: #B7E1D1; animation-delay: 350ms"></span>
    <span class="pop" style="position: absolute; left: 88px; top: 120px; width: 8px; height: 8px; border-radius: 50%; background: #A9D3FF; animation-delay: 400ms"></span>
    <span class="pop" style="position: absolute; left: 320px; top: 170px; width: 12px; height: 12px; border-radius: 50%; background: #FFD95A; animation-delay: 450ms"></span>
    <span class="pop" style="position: absolute; left: 30px; top: 210px; width: 9px; height: 9px; border-radius: 50%; background: #B7E1D1; animation-delay: 500ms"></span>
    <svg class="pop" width="28" height="28" viewBox="0 0 24 24" style="position: absolute; left: 262px; top: 20px; animation-delay: 380ms" aria-hidden="true"><path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2Z" fill="#F97940"></path></svg>
    <svg class="pop" width="20" height="20" viewBox="0 0 24 24" style="position: absolute; left: 70px; top: 70px; animation-delay: 430ms" aria-hidden="true"><path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2Z" fill="#FFD95A"></path></svg>

    <div class="cheer" style="position: absolute; left: 87px; top: 70px; width: 216px; height: 202px">
      <svg class="breathe" width="216" height="202" viewBox="0 0 120 112" aria-hidden="true"><path d="M58 8 C84 2 112 18 114 48 C116 78 98 104 64 106 C30 108 4 88 6 58 C8 30 30 14 58 8 Z" fill="#FFD95A"></path><path d="M43 52 q7 -9 14 0 M63 50 q7 -9 14 0" stroke="#1F1F1F" stroke-width="4" fill="none" stroke-linecap="round"></path><path d="M52 66 q8 7 16 0" stroke="#1F1F1F" stroke-width="3" fill="none" stroke-linecap="round"></path><ellipse cx="38" cy="64" rx="6" ry="3.5" fill="#FFB5C1"></ellipse><ellipse cx="82" cy="62" rx="6" ry="3.5" fill="#FFB5C1"></ellipse></svg>
    </div>
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; line-height: 1.2">Week 3 done!</h1>
    <div style="font-size: 17px; font-weight: 500; color: #4F4A45">You practiced the past tense.</div>
  </div>

  <div style="background: #FFFFFF; border-radius: 28px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z" fill="#FFD95A" stroke="#1F1F1F" stroke-width="1.5" stroke-linejoin="round"></path></svg>
      <div style="flex-grow: 1; font-size: 16px; font-weight: 700">Stars this week</div>
      <div style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">+{{ weekStars }}</div>
    </div>
    <div style="height: 1px; background: #EFEAE4"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="34" height="30" viewBox="0 0 120 100" aria-hidden="true"><path d="M18 52 v-8 a42 26 0 0 1 84 0 v8 z" fill="#FFE59A" stroke="#1F1F1F" stroke-width="5" stroke-linejoin="round"></path><rect x="18" y="52" width="84" height="38" rx="6" fill="#FFD95A" stroke="#1F1F1F" stroke-width="5"></rect><rect x="53" y="46" width="14" height="16" rx="4" fill="#1F1F1F"></rect></svg>
      <div style="flex-grow: 1">
        <div style="font-size: 16px; font-weight: 700">Treasure chest</div>
        <div style="font-size: 13px; font-weight: 500; color: #6B655F">Opens when you're back at school</div>
      </div>
      <div style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">{{ totalStars }}</div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <button style="background: #1F1F1F; color: #FFFFFF; border: none; border-radius: 999px; padding: 8px 8px 8px 24px; display: flex; align-items: center; justify-content: space-between; font-size: 18px; font-weight: 700">Back to my plan
    <span style="width: 44px; height: 44px; border-radius: 50%; background: #FFD95A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 0 };
  }
  componentDidMount() {
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { this.setState({ t: 1 }); return; }
    const start = performance.now() + 600;
    const step = (now) => {
      const p = Math.min(1, Math.max(0, (now - start) / 900));
      this.setState({ t: p });
      if (p < 1) this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    if (this.raf) cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const t = this.state.t;
    const eased = 1 - Math.pow(1 - t, 3);
    const week = Math.round(40 * eased);
    return { weekStars: week, totalStars: 142 + week };
  }
}
</script>
</body>
</html>
